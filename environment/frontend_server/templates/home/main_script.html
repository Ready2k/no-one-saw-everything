{% load static %}

<div id="step" style="display:none">{{step}}</div>
<div id="sim_code" style="display:none">{{sim_code}}</div>
<div id="persona_name_list" style="display:none">{{persona_name_str}}</div>
<div id="persona_init_pos" style="display:none">
	{% for i in persona_init_pos %}
		<span>{{i.0}},{{i.1}},{{i.2}}</span>
	{% endfor %}
</div>

<script type="text/javascript">
	/*
	  Main resources: 
	  https://www.youtube.com/watch?v=cKIG1lKwLeo&t=401s&ab_channel=HongLy
	  For the ground zero code, see the exported files from here: 
	  https://codepen.io/mikewesthad/pen/BVeoYP?editors=1111 

	  Also worth taking a look: 
	  https://www.youtube.com/watch?v=fdXcD9X4NrQ&ab_channel=MorganPage
	  and 
	  https://www.youtube.com/watch?v=MR2CvWxOEsw&ab_channel=MattWilber
	 */


	// ###########################################################################
	// PREAMBLE
	// ###########################################################################

	// <step> -- one full loop around all three phases determined by <phase> is 
	// a step. We use this to link the steps in the backend. 
	let step = parseInt(document.getElementById('step').innerHTML);
	let sim_code = document.getElementById('sim_code').innerHTML;
	let mode = "{{ mode }}";
	// let persona_names = document.getElementById('persona_name_list').innerHTML.split(",");

	let spans = document.getElementById('persona_init_pos').getElementsByTagName('span');
	let persona_names = {};
	for(var i = 0, l = spans.length; i < l; i++){
		let x = spans[i].innerText.split(",");
		persona_names[x[0]] = [parseInt(x[1]), parseInt(x[2])]
	}


	// Phaser 3.0 global settings. 
	// Configuration meant to be passed to the main Phaser game instance. 
	const config = {
	  type: Phaser.AUTO,
	  width: 1500,
	  height: 800,
	  parent: "game-container",
	  pixelArt: true,
	  physics: {
	    default: "arcade",
	    arcade: {
	      gravity: { y: 0 } } },
	  scene: {
	    preload: preload,
	    create: create,
	    update: update } };

	// const config = {
	//   type: Phaser.AUTO,
	//   width: 4480,
	//   height: 3200,
	//   parent: "game-container",
	//   pixelArt: true,
	//   physics: {
	//     default: "arcade",
	//     arcade: {
	//       gravity: { y: 0 } } },
	//   scene: {
	//     preload: preload,
	//     create: create,
	//     update: update },
	//   scale: {zoom: 0.5} };

	// Creating the game instance and setting up the main Phaser variables that  
	// will be used in it. 
	const game = new Phaser.Game(config);
	let cursors;
	let player;
	let camera;
	let showDebug = false;

	// Zoom limits for the map camera (1 == default 1:1 view).
	const MIN_ZOOM = 0.2;
	const MAX_ZOOM = 2.5;

	// Multiplicatively step the camera zoom (wired to the +/- buttons).
	function zoomCamera(factor) {
		if (!camera) return;
		camera.setZoom(Phaser.Math.Clamp(camera.zoom * factor, MIN_ZOOM, MAX_ZOOM));
	}

	// Reset zoom back to the default 1:1 view.
	function resetZoom() {
		if (camera) camera.setZoom(1);
	}

	// Recenter the camera on a persona by teleporting the (invisible) camera
	// follow target to that persona's current position. Arrow-key panning keeps
	// working afterward because the camera continues to follow <player>.
	function goToPersona(persona_name) {
		let target = personas[persona_name];
		if (!target || !player) return;
		player.setPosition(target.x, target.y);
	}

	// Per-persona live snapshot of what the frontend already knows this step
	// (current action / location / conversation), populated in the execute phase.
	var live_state = {};
	// Name of the persona whose popout is currently open (null if closed), so the
	// execute phase can keep an open popout in sync as the simulation advances.
	var popout_open_for = null;

	// --- Click-to-inspect popout ---------------------------------------------
	function _popoutEscape(s) {
		if (s == null) return "";
		return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
	}
	function _popoutSection(label, content, isHtml) {
		if (content == null || content === "") return "";
		return "<div style='margin-bottom:1em'><div style='font-weight:700; color:#555'>" + label +
		       "</div><div style='margin-top:0.2em'>" + (isHtml ? content : _popoutEscape(content)) + "</div></div>";
	}
	// Last rendered strings, so we only touch the DOM when something actually
	// changed. Re-writing identical innerHTML on every refresh is what caused the
	// popout to flicker.
	var _popout_last_html = "";
	var _popout_last_title = "";
	// Latest backend planning context per persona, kept so a live refresh can
	// re-render without blanking the rich sections while we wait on the fetch.
	var _popout_extra = {};

	function closePersonaPopout() {
		let p = document.getElementById("persona_popout");
		if (p) p.style.display = "none";
		popout_open_for = null;
	}

	// Render the popout for <persona_name>, combining the frontend's live snapshot
	// with the most recent backend planning context. DOM writes are skipped when
	// the content is unchanged so the panel never flickers.
	function renderPopout(persona_name) {
		let title = document.getElementById("persona_popout_title");
		let body = document.getElementById("persona_popout_body");
		if (!title || !body) return;
		let live = live_state[persona_name] || {};
		let extra = _popout_extra[persona_name] || {};

		let emoji = extra.pronunciatio || live.pronunciatio || "";
		let new_title = (emoji ? _popoutEscape(emoji) + " " : "") + _popoutEscape(persona_name);

		let html = "";
		html += _popoutSection("🟢 Doing now", live.doing_now || extra.doing_now || "—");
		html += _popoutSection("📍 Location", live.location || extra.location);
		html += _popoutSection("⏭️ Up next", extra.next_task);
		html += _popoutSection("🧠 Mindset", extra.currently);
		if (extra.daily_plan && extra.daily_plan.length) {
			let items = extra.daily_plan.map(p => "<li>" + _popoutEscape(p) + "</li>").join("");
			html += _popoutSection("🗒️ Today's plan", "<ol style='padding-left:1.2em; margin:0.3em 0'>" + items + "</ol>", true);
		}
		if (extra.thoughts && extra.thoughts.length) {
			let items = extra.thoughts.map(t => "<li>" + _popoutEscape(t.description) + "</li>").join("");
			html += _popoutSection("💭 Recent thoughts", "<ul style='padding-left:1.2em; margin:0.3em 0'>" + items + "</ul>", true);
		}
		if (live.chat_html && live.chat_html.indexOf("None at the moment") === -1) {
			html += _popoutSection("💬 Conversation", live.chat_html, true);
		}
		html = html || "<em>No information available yet.</em>";

		if (new_title !== _popout_last_title) { title.innerHTML = new_title; _popout_last_title = new_title; }
		if (html !== _popout_last_html) { body.innerHTML = html; _popout_last_html = html; }
	}

	// Fetch the latest backend planning context for the open persona and re-render.
	function refreshPersonaPopout(persona_name) {
		if (!persona_name) return;
		let name_os = persona_name.replace(/ /g, "_");
		fetch("/persona_current_state/" + encodeURIComponent(sim_code) + "/" + name_os + "/")
			.then(r => r.json())
			.then(data => {
				if (data && !data.error) _popout_extra[persona_name] = data;
				if (popout_open_for === persona_name) renderPopout(persona_name);
			})
			.catch(() => {});
	}

	// Open a floating panel describing what a persona is doing now / next, their
	// mindset, daily plan and recent thoughts. Rendered immediately from live data,
	// then enriched from the backend; afterwards it self-refreshes every 10s.
	function openPersonaPopout(persona_name) {
		let popout = document.getElementById("persona_popout");
		if (!popout) return;
		// New persona selected: drop the dedupe cache so the panel repaints.
		if (popout_open_for !== persona_name) { _popout_last_html = ""; _popout_last_title = ""; }
		popout_open_for = persona_name;
		popout.style.display = "block";
		renderPopout(persona_name);
		refreshPersonaPopout(persona_name);
	}

	// Refresh the open popout every 10 seconds rather than on every simulation
	// step, so it stays current without constantly flickering.
	setInterval(function() {
		if (popout_open_for) refreshPersonaPopout(popout_open_for);
	}, 10000);

	// Persona related variables. This should have the name of the persona as its 
	// keys, and the instances of the Persona class as the values.
	var spawn_tile_loc = {};
	// for (var i = 0; i < persona_names.length; i++) { 
	// 	spawn_tile_loc[persona_names[i]] = [0, 0]
	// }

	for (var key in persona_names){
		spawn_tile_loc[key] = persona_names[key] ;
	}
	console.log(spawn_tile_loc);

	var personas = {};
	var pronunciatios = {};
	let anims_direction;
	let pre_anims_direction;
	let pre_anims_direction_dict = {};

	let curr_maze = "the_ville";

	// <tile_width> is the width of one individual tile (tiles are square)
	let tile_width = 32;
	// Important: tile_width % movement_speed has to be 0. 
	// <movement_speed> determines how fast we move at each upate cylce. 
	let movement_speed = 32; 

	// <timer_max> determines how frequently our update function will query the 
	// frontend server. If it's higher, we wait longer cycles. 
	let timer_max = 0;
	let timer = timer_max;

	// <phase> -- there are three phases: "process," "update," and "execute."
	let phase = "update"; // or "update" or "execute"

	// Variables for storing movements that are sent from the backend server.
	let execute_movement;
	let execute_count_max = tile_width/movement_speed;
	let execute_count = execute_count_max;
	let movement_target = {};

	// --- Replay-mode playback state ---------------------------------------
	// Replay reads already-recorded movement/{step}.json files directly
	// (via /replay_movement/) instead of the live process/update handshake,
	// so it can pause, change speed, and seek freely without a backend.
	let replay_playing = false;
	let replay_pending = false;
	// Same tiers as demo()'s play_speed_opt, so the two playback surfaces feel
	// consistent: movement_speed (px/frame) directly sets walk speed.
	let replay_speed_tiers = {"1": 1, "2": 2, "3": 4, "4": 8, "5": 16, "6": 32};
	let replay_speed_key = "2";
	let replay_max_step = {{ max_step|default:"0" }};
	let replay_start_datetime = new Date(Date.parse("{{ start_datetime|default:'' }}"));
	let replay_sec_per_step = {{ sec_per_step|default:"10" }};

	function setReplaySpeed(key) {
		if (!replay_speed_tiers[key]) return;
		replay_speed_key = key;
		movement_speed = replay_speed_tiers[key];
		execute_count_max = tile_width / movement_speed;
	}

	function fetchStepData(n, cb) {
		fetch("/replay_movement/" + encodeURIComponent(sim_code) + "/" + n + "/")
			.then(r => r.json())
			.then(data => cb(data && data.found ? data : null))
			.catch(() => cb(null));
	}

	// Populate the persona action/location/chat panels and the clock, given a
	// step's movement data. Shared by the end of a walk animation and by an
	// instant seek (scrubber/time-jump), so both leave the page in the same
	// state.
	function renderReplayStepInfo(data) {
		document.getElementById("game-time-content").innerHTML = data["meta"]["curr_time"];
		for (let curr_persona_name in data["persona"]) {
			let curr_persona_name_os = curr_persona_name.replace(/ /g, "_");
			let description_content = data["persona"][curr_persona_name]["description"];
			let chat_content = "";
			if (data["persona"][curr_persona_name]["chat"] != null) {
				for (let j = 0; j < data["persona"][curr_persona_name]["chat"].length; j++) {
					chat_content += data["persona"][curr_persona_name]["chat"][j][0] + ": " + data["persona"][curr_persona_name]["chat"][j][1] + "<br>";
				}
			} else {
				chat_content = "<em>None at the moment</em>";
			}
			let action_el = document.getElementById("current_action__" + curr_persona_name_os);
			let target_el = document.getElementById("target_address__" + curr_persona_name_os);
			let chat_el = document.getElementById("chat__" + curr_persona_name_os);
			if (action_el) action_el.innerHTML = description_content.split("@")[0];
			if (target_el) target_el.innerHTML = description_content.split("@")[1];
			if (chat_el) chat_el.innerHTML = chat_content;
			live_state[curr_persona_name] = {
				doing_now: description_content.split("@")[0],
				location: description_content.split("@")[1],
				chat_html: chat_content
			};
		}
	}

	// Snap every persona sprite directly to <data>'s recorded tile, with no
	// walking animation -- used for seeking (scrubber/time-jump/restart),
	// where visually walking through every intervening step would be wrong.
	function snapReplaySprites(data) {
		for (let curr_persona_name in data["persona"]) {
			let sprite = personas[curr_persona_name];
			if (!sprite) continue;
			let x = data["persona"][curr_persona_name]["movement"][0] * tile_width;
			let y = data["persona"][curr_persona_name]["movement"][1] * tile_width;
			sprite.body.x = x;
			sprite.body.y = y;
			sprite.anims.stop();
			let pron = pronunciatios[curr_persona_name];
			if (pron) {
				pron.x = x - 6;
				pron.y = y - 42 - 32;
				let rgx = new RegExp(/(\p{L}{1})\p{L}+/, 'gu');
				let initials = [...curr_persona_name.matchAll(rgx)] || [];
				initials = ((initials.shift()?.[1] || '') + (initials.pop()?.[1] || '')).toUpperCase();
				pron.setText(initials + ": " + data["persona"][curr_persona_name]["pronunciatio"]);
			}
		}
	}

	// Jump straight to step <n> (clamped to what's been recorded), no
	// animation. Used by the scrubber, time-jump box, and Restart.
	function seekReplayStep(n) {
		n = Math.max(0, Math.min(replay_max_step, Math.round(n)));
		fetchStepData(n, function(data) {
			if (!data) return;
			execute_movement = null;
			execute_count = 0;
			step = n;
			snapReplaySprites(data);
			renderReplayStepInfo(data);
			let scrub = document.getElementById("replay_scrubber");
			if (scrub) scrub.value = n;
		});
	}

	// Request the next step and, once it arrives, start walking sprites
	// toward it (normal forward playback, one step at a time).
	function requestReplayStep(n) {
		if (replay_pending) return;
		if (n > replay_max_step) { replay_playing = false; return; }
		replay_pending = true;
		fetchStepData(n, function(data) {
			replay_pending = false;
			if (!data) { replay_playing = false; return; }
			step = n;
			execute_movement = data;
			for (let curr_persona_name in data["persona"]) {
				let x = data["persona"][curr_persona_name]["movement"][0];
				let y = data["persona"][curr_persona_name]["movement"][1];
				movement_target[curr_persona_name] = [x * tile_width, y * tile_width];
			}
			execute_count = execute_count_max;
		});
	}

	function replayPlay() {
		if (mode !== "replay") return;
		replay_playing = true;
		if (!execute_movement && execute_count <= 0) requestReplayStep(step + 1);
	}
	function replayPause() { replay_playing = false; }
	function replayStop() { replay_playing = false; execute_movement = null; execute_count = 0; }
	function replayRestart() { replayStop(); seekReplayStep(0); replayPlay(); }

	function onReplaySpeedChange(key) { setReplaySpeed(key); }

	function onReplayScrub(value) {
		replayPause();
		seekReplayStep(parseInt(value));
	}

	function onReplayTimeJump(hhmm) {
		let m = /^(\d{1,2}):(\d{2})$/.exec((hhmm || "").trim());
		if (!m) return;
		let target = new Date(replay_start_datetime.getTime());
		target.setHours(parseInt(m[1]), parseInt(m[2]), 0, 0);
		let target_step = Math.floor((target.getTime() - replay_start_datetime.getTime()) / 1000 / replay_sec_per_step);
		replayPause();
		seekReplayStep(target_step);
	}

	// Grow replay_max_step (and the scrubber's bound) while a still-running
	// sim is being watched, without needing a page reload.
	function pollReplayBounds() {
		fetch("/replay_bounds/" + encodeURIComponent(sim_code) + "/")
			.then(r => r.json())
			.then(function(data) {
				replay_max_step = data.max_step;
				let scrub = document.getElementById("replay_scrubber");
				if (scrub) scrub.max = replay_max_step;
				let bound_el = document.getElementById("replay_max_step_label");
				if (bound_el) bound_el.innerHTML = replay_max_step;
			})
			.catch(() => {});
	}

	function updateReplay() {
		const camera_speed = 400;
		player.body.setVelocity(0);
		if (cursors.left.isDown) player.body.setVelocityX(-camera_speed);
		if (cursors.right.isDown) player.body.setVelocityX(camera_speed);
		if (cursors.up.isDown) player.body.setVelocityY(-camera_speed);
		if (cursors.down.isDown) player.body.setVelocityY(camera_speed);

		if (!execute_movement || execute_count <= 0) return;

		for (let curr_persona_name in movement_target) {
			let curr_persona = personas[curr_persona_name];
			if (!curr_persona) continue;
			let target = movement_target[curr_persona_name];
			let dir = "";
			if (curr_persona.body.x < target[0]) { curr_persona.body.x += movement_speed; dir = "r"; }
			else if (curr_persona.body.x > target[0]) { curr_persona.body.x -= movement_speed; dir = "l"; }
			else if (curr_persona.body.y < target[1]) { curr_persona.body.y += movement_speed; dir = "d"; }
			else if (curr_persona.body.y > target[1]) { curr_persona.body.y -= movement_speed; dir = "u"; }

			let pron = pronunciatios[curr_persona_name];
			if (pron) { pron.x = curr_persona.body.x - 6; pron.y = curr_persona.body.y - 42 - 32; }

			let tex_key = curr_persona_name.replace(/ /g, "_");
			if (dir === "l") curr_persona.anims.play(tex_key + "-left-walk", true);
			else if (dir === "r") curr_persona.anims.play(tex_key + "-right-walk", true);
			else if (dir === "u") curr_persona.anims.play(tex_key + "-up-walk", true);
			else if (dir === "d") curr_persona.anims.play(tex_key + "-down-walk", true);
		}

		execute_count -= 1;
		if (execute_count <= 0) {
			for (let curr_persona_name in movement_target) {
				let curr_persona = personas[curr_persona_name];
				if (!curr_persona) continue;
				curr_persona.body.x = movement_target[curr_persona_name][0];
				curr_persona.body.y = movement_target[curr_persona_name][1];
				curr_persona.anims.stop();
			}
			renderReplayStepInfo(execute_movement);
			if (replay_playing) requestReplayStep(step + 1);
		}
	}


	// ###########################################################################
	// ENGINE
	// ###########################################################################

	// Joon: Phaser 3.0 is oriented around "scenes" -- recall how Pokemon plays: 
	//       there is the outdoor space, and then there is the indoor space; when
	//       you go inside, you transition to a new "scene" and the outdoor space
	//       basically disappears. 
	//       A scene in Phaser has four key methods that are called at different
	//       stages of rendering for different purposes. They are: 
	//       init() -> preload() -> create() -> update()
	//         init() is called only once at the very beginning. This is the 
	//           initialization function in case that is needed. 
	//         preload() is called once and preloads any of the assets
	//         create() is also called once after preloading... creates sprites 
	//           and actually displays stuff
	//         update() is called on each frame during the game play 

	function preload() {  
	  // Loading the necessary images (e.g., the background image, character 
	  // sprites). 

	  // Joon: for load.image, the first parameter is simply the key value that
	  //       you are passing in. The second parameter should be pointed to the
	  //       png file that contains the tileset. 
	  //       Also IMPORTANT: when you create a tileset in Tiled, always be  
	  //       sure to check the "embedded" option. 
	  this.load.image("blocks_1", "{% static 'assets/the_ville/visuals/map_assets/blocks/blocks_1.png' %}");
	  this.load.image("walls", "{% static 'assets/the_ville/visuals/map_assets/v1/Room_Builder_32x32.png' %}");
	  this.load.image("interiors_pt1", "{% static 'assets/the_ville/visuals/map_assets/v1/interiors_pt1.png' %}");
	  this.load.image("interiors_pt2", "{% static 'assets/the_ville/visuals/map_assets/v1/interiors_pt2.png' %}");
	  this.load.image("interiors_pt3", "{% static 'assets/the_ville/visuals/map_assets/v1/interiors_pt3.png' %}");
	  this.load.image("interiors_pt4", "{% static 'assets/the_ville/visuals/map_assets/v1/interiors_pt4.png' %}");
	  this.load.image("interiors_pt5", "{% static 'assets/the_ville/visuals/map_assets/v1/interiors_pt5.png' %}");
	  this.load.image("CuteRPG_Field_B", "{% static 'assets/the_ville/visuals/map_assets/cute_rpg_word_VXAce/tilesets/CuteRPG_Field_B.png' %}");
	  this.load.image("CuteRPG_Field_C", "{% static 'assets/the_ville/visuals/map_assets/cute_rpg_word_VXAce/tilesets/CuteRPG_Field_C.png' %}");
	  this.load.image("CuteRPG_Harbor_C", "{% static 'assets/the_ville/visuals/map_assets/cute_rpg_word_VXAce/tilesets/CuteRPG_Harbor_C.png' %}");
	  this.load.image("CuteRPG_Village_B", "{% static 'assets/the_ville/visuals/map_assets/cute_rpg_word_VXAce/tilesets/CuteRPG_Village_B.png' %}");
	  this.load.image("CuteRPG_Forest_B", "{% static 'assets/the_ville/visuals/map_assets/cute_rpg_word_VXAce/tilesets/CuteRPG_Forest_B.png' %}");
	  this.load.image("CuteRPG_Desert_C", "{% static 'assets/the_ville/visuals/map_assets/cute_rpg_word_VXAce/tilesets/CuteRPG_Desert_C.png' %}");
	  this.load.image("CuteRPG_Mountains_B", "{% static 'assets/the_ville/visuals/map_assets/cute_rpg_word_VXAce/tilesets/CuteRPG_Mountains_B.png' %}");
	  this.load.image("CuteRPG_Desert_B", "{% static 'assets/the_ville/visuals/map_assets/cute_rpg_word_VXAce/tilesets/CuteRPG_Desert_B.png' %}");
	  this.load.image("CuteRPG_Forest_C", "{% static 'assets/the_ville/visuals/map_assets/cute_rpg_word_VXAce/tilesets/CuteRPG_Forest_C.png' %}");

	  // Joon: This is the export json file you get from Tiled. 
	  this.load.tilemapTiledJSON("map", "{% static 'assets/the_ville/visuals/the_ville_jan7.json' %}");

	  // An atlas is a way to pack multiple images together into one texture. I'm 
	  // using it to load all the player animations (walking left, walking right, 
	  // etc.) in one image. For more info see:
	  // https://labs.phaser.io/view.html?src=src/animation/texture%20atlas%20animation.js
	  // If you don't use an atlas, you can do the same thing with a spritesheet, 
	  // see: https://labs.phaser.io/view.html?src=src/animation/single%20sprite%20sheet.js
	  // Joon: Technically, I think this guy had the best tutorial for atlas: 
	  //       https://www.youtube.com/watch?v=fdXcD9X4NrQ&ab_channel=MorganPage
	  this.load.atlas("atlas",
	                  "https://mikewesthad.github.io/phaser-3-tilemap-blog-posts/post-1/assets/atlas/atlas.png",
	                  "https://mikewesthad.github.io/phaser-3-tilemap-blog-posts/post-1/assets/atlas/atlas.json");

	  // Load each persona's own character sheet as its own atlas, keyed by
	  // their underscored name, so every persona can use their own sprite
	  // instead of sharing the single "atlas" placeholder above (which is
	  // still used for the invisible camera-follow sprite only).
	  {% for p in persona_names %}
		  {% with 'assets/characters/'|add:p.1|add:'.png' as image_static %}
			  this.load.atlas("{{p.1}}", "{% static image_static %}", "{% static 'assets/characters/atlas.json' %}");
			{% endwith %}
	  {% endfor %}
	}

	function create() {  
	  const map = this.make.tilemap({ key: "map" });
	  // Joon: Logging map is really helpful for debugging here: 
	  //       console.log(map);

	  // The first parameter is the name you gave to the tileset in Tiled and then
	  // the key of the tileset image in Phaser's cache (i.e. the name you used in
	  // preload)
	  // Joon: for the first parameter here, really take a look at the 
	  //       console.log(map) output. You need to make sure that the name 
	  //       matches.
	  const collisions = map.addTilesetImage("blocks", "blocks_1");
	  const walls = map.addTilesetImage("Room_Builder_32x32", "walls");
	  const interiors_pt1 = map.addTilesetImage("interiors_pt1", "interiors_pt1");
	  const interiors_pt2 = map.addTilesetImage("interiors_pt2", "interiors_pt2");
	  const interiors_pt3 = map.addTilesetImage("interiors_pt3", "interiors_pt3");
	  const interiors_pt4 = map.addTilesetImage("interiors_pt4", "interiors_pt4");
	  const interiors_pt5 = map.addTilesetImage("interiors_pt5", "interiors_pt5");
	  const CuteRPG_Field_B = map.addTilesetImage("CuteRPG_Field_B", "CuteRPG_Field_B");
	  const CuteRPG_Field_C = map.addTilesetImage("CuteRPG_Field_C", "CuteRPG_Field_C");
	  const CuteRPG_Harbor_C = map.addTilesetImage("CuteRPG_Harbor_C", "CuteRPG_Harbor_C");
	  const CuteRPG_Village_B = map.addTilesetImage("CuteRPG_Village_B", "CuteRPG_Village_B");
	  const CuteRPG_Forest_B = map.addTilesetImage("CuteRPG_Forest_B", "CuteRPG_Forest_B");
	  const CuteRPG_Desert_C = map.addTilesetImage("CuteRPG_Desert_C", "CuteRPG_Desert_C");
	  const CuteRPG_Mountains_B = map.addTilesetImage("CuteRPG_Mountains_B", "CuteRPG_Mountains_B");
	  const CuteRPG_Desert_B = map.addTilesetImage("CuteRPG_Desert_B", "CuteRPG_Desert_B");
	  const CuteRPG_Forest_C = map.addTilesetImage("CuteRPG_Forest_C", "CuteRPG_Forest_C");

	  // The first parameter is the layer name (or index) taken from Tiled, the 
	  // second parameter is the tileset you set above, and the final two 
	  // parameters are the x, y coordinate. 
	  // Joon: The "layer name" that comes as the first parameter value  
	  //       literally is taken from our Tiled layer name. So to find out what
	  //       they are; you actually need to open up tiled and see how you 
	  //       named things there. 
	  let tileset_group_1 = [CuteRPG_Field_B, CuteRPG_Field_C, CuteRPG_Harbor_C, CuteRPG_Village_B, 
	  											 CuteRPG_Forest_B, CuteRPG_Desert_C, CuteRPG_Mountains_B, CuteRPG_Desert_B, CuteRPG_Forest_C,
	  											 interiors_pt1, interiors_pt2, interiors_pt3, interiors_pt4, interiors_pt5, walls];
	  const bottomGroundLayer = map.createLayer("Bottom Ground", tileset_group_1, 0, 0);
	  const exteriorGroundLayer = map.createLayer("Exterior Ground", tileset_group_1, 0, 0);
	  const exteriorDecorationL1Layer = map.createLayer("Exterior Decoration L1", tileset_group_1, 0, 0);
	  const exteriorDecorationL2Layer = map.createLayer("Exterior Decoration L2", tileset_group_1, 0, 0);
	  const interiorGroundLayer = map.createLayer("Interior Ground", tileset_group_1, 0, 0);
	  const wallLayer = map.createLayer("Wall", [CuteRPG_Field_C, walls], 0, 0);
	  const interiorFurnitureL1Layer = map.createLayer("Interior Furniture L1", tileset_group_1, 0, 0);
	  const interiorFurnitureL2Layer = map.createLayer("Interior Furniture L2 ", tileset_group_1, 0, 0);
	  const foregroundL1Layer = map.createLayer("Foreground L1", tileset_group_1, 0, 0);
	  const foregroundL2Layer = map.createLayer("Foreground L2", tileset_group_1, 0, 0);
	  foregroundL1Layer.setDepth(2);
	  foregroundL2Layer.setDepth(2);

	  const collisionsLayer = map.createLayer("Collisions", collisions, 0, 0);
	  // const groundLayer = map.createLayer("Ground", walls, 0, 0);
	  // const indoorGroundLayer = map.createLayer("Indoor Ground", walls, 0, 0);
	  // const wallsLayer = map.createLayer("Walls", walls, 0, 0);
	  // const interiorsLayer = map.createLayer("Furnitures", interiors, 0, 0);
	  // const builtInLayer = map.createLayer("Built-ins", interiors, 0, 0);
	  // const appliancesLayer = map.createLayer("Appliances", interiors, 0, 0);
	  // const foregroundLayer = map.createLayer("Foreground", interiors, 0, 0);

	  // Joon : This is where you want to create a custom field for the tileset
	  //        in Tiled. Take a look at this guy's tutorial: 
	  //        https://www.youtube.com/watch?v=MR2CvWxOEsw&ab_channel=MattWilber
	  collisionsLayer.setCollisionByProperty({ collide: true });
	  // By default, everything gets depth sorted on the screen in the order we 
	  // created things. Here, we want the "Above Player" layer to sit on top of 
	  // the player, so we explicitly give it a depth. Higher depths will sit on 
	  // top of lower depth objects.
	  // Collisions layer should get a negative depth since we do not want to see
	  // it. 
	  collisionsLayer.setDepth(-1);
	  // foregroundL1Layer.setDepth(2);
	  // foregroundL1Layer.setDepth(2);

	  // *** SET UP CAMERA *** 
	  // "player" is to be set as the center of mass for our "camera." We 
	  // basically create a game character sprite as we would for our personas 
	  // but we move it to depth -1 and let it pass through the collision map;  
	  // that is, do not have the following line: 
	  // this.physics.add.collider(player, collisionsLayer);
	  // OLD NOTE: Create a sprite with physics enabled via the physics system. 
	  // The image  used for the sprite has a bit of whitespace, so I'm using 
	  // setSize & setOffset to control the size of the player's body.
	  player = this.physics.add.
	                sprite(800, 288, "atlas", "misa-front").
	                setSize(30, 40).
	                setOffset(0, 0);
	  player.setDepth(-1);
	  // Setting up the camera.
	  camera = this.cameras.main;
	  camera.startFollow(player);
	  camera.setBounds(0, 0, map.widthInPixels, map.heightInPixels);
	  cursors = this.input.keyboard.createCursorKeys();

	  // *** ZOOM: mouse wheel zooms the camera in/out, clamped to a range. ***
	  this.input.on("wheel", function(pointer, gameObjects, deltaX, deltaY) {
	    let new_zoom = camera.zoom - deltaY * 0.0015;
	    camera.setZoom(Phaser.Math.Clamp(new_zoom, MIN_ZOOM, MAX_ZOOM));
	  });

	  // *** PAN: click-and-drag the map with the mouse (grab panning). ***
	  // <drag_moved> lets the persona click handlers tell a real click apart from
	  // the end of a drag, so panning doesn't accidentally open the popout.
	  let isDragging = false;
	  let dragPrevX = 0;
	  let dragPrevY = 0;
	  var drag_moved = false;
	  this.input.on("pointerdown", function(pointer) {
	    isDragging = true;
	    drag_moved = false;
	    dragPrevX = pointer.x;
	    dragPrevY = pointer.y;
	    game.canvas.style.cursor = "grabbing";
	  });
	  this.input.on("pointerup", function() {
	    isDragging = false;
	    game.canvas.style.cursor = "grab";
	  });
	  this.input.on("pointermove", function(pointer) {
	    if (!isDragging) return;
	    if (Math.abs(pointer.x - pointer.downX) > 4 || Math.abs(pointer.y - pointer.downY) > 4) drag_moved = true;
	    player.x = Phaser.Math.Clamp(player.x - (pointer.x - dragPrevX) / camera.zoom, 0, map.widthInPixels);
	    player.y = Phaser.Math.Clamp(player.y - (pointer.y - dragPrevY) / camera.zoom, 0, map.heightInPixels);
	    dragPrevX = pointer.x;
	    dragPrevY = pointer.y;
	  });
	  game.canvas.style.cursor = "grab";

	  // *** SET UP PERSONAS *** 
	  // We start by creating the game sprite objects. 
	  for (let i=0; i<Object.keys(spawn_tile_loc).length; i++) { 
	    let persona_name = Object.keys(spawn_tile_loc)[i];
	    let start_pos = [spawn_tile_loc[persona_name][0] * tile_width + tile_width / 2,
	                     spawn_tile_loc[persona_name][1] * tile_width + tile_width];
	    let tex_key = persona_name.replace(/ /g, "_");
	    let new_sprite = this.physics.add
	                         .sprite(start_pos[0], start_pos[1], tex_key, "down")
	                         .setSize(30, 40)
	                         .setOffset(0, 32); // DEBUG 1 --- I added 32 offset on Dec 29.
	    // Here, we are creating the persona and its pronunciatio sprites.
	    personas[persona_name] = new_sprite;

	    // Click a persona sprite to open the inspect popout (unless it was a drag).
	    new_sprite.setInteractive();
	    (function(name) {
	      new_sprite.on("pointerup", function() {
	        if (!drag_moved) openPersonaPopout(name);
	      });
	    })(persona_name);

	    pronunciatios[persona_name] = this.add.text(
	                                   new_sprite.body.x - 6, 
	                                   new_sprite.body.y - 42 - 32, // DEBUG 1 --- I added 32 offset on Dec 29. 
	                                   "🦁", {
	                                   font: "28px monospace", 
	                                   fill: "#000000", 
	                                   padding: { x: 8, y: 8}, 
	                                   backgroundColor: "#ffffff",
	                                   border:"solid",
	                                   borderRadius:"10px"}).setDepth(3);
	  }

	  // Create each persona's walking animations from their own texture atlas
	  // (loaded above, keyed by underscored name). Stored in the global
	  // animation manager so each persona's sprite can play its own set.
	  const anims = this.anims;
	  for (let persona_name in spawn_tile_loc) {
	    let tex_key = persona_name.replace(/ /g, "_");

	    anims.create({
	      key: tex_key + "-left-walk",
	      frames: anims.generateFrameNames(tex_key, { prefix: "left-walk.", start: 0, end: 3, zeroPad: 3 }),
	      frameRate: 4,
	      repeat: -1 });

	    anims.create({
	      key: tex_key + "-right-walk",
	      frames: anims.generateFrameNames(tex_key, { prefix: "right-walk.", start: 0, end: 3, zeroPad: 3 }),
	      frameRate: 4,
	      repeat: -1 });

	    anims.create({
	      key: tex_key + "-down-walk",
	      frames: anims.generateFrameNames(tex_key, { prefix: "down-walk.", start: 0, end: 3, zeroPad: 3 }),
	      frameRate: 4,
	      repeat: -1 });

	    anims.create({
	      key: tex_key + "-up-walk",
	      frames: anims.generateFrameNames(tex_key, { prefix: "up-walk.", start: 0, end: 3, zeroPad: 3 }),
	      frameRate: 4,
	      repeat: -1 });
	  }

	  if (mode === "replay") {
	    setReplaySpeed(replay_speed_key);
	    seekReplayStep(step);
	    setInterval(pollReplayBounds, 5000);
	  }
	}


	function update(time, delta) {
		if (mode === "replay") {
			// Replay drives play/pause itself (toggling replay_playing) rather
			// than pausing the whole Phaser scene, so the map stays pannable
			// while playback is paused.
			updateReplay();
			return;
		}

		// *** SETUP PLAY AND PAUSE BUTTON ***
		let play_context = this;
		function game_resume() {
			play_context.scene.resume();
		}
		play_button.onclick = function(){
			game_resume();
		};
		function game_pause() {
			play_context.scene.pause();
		}
		pause_button.onclick = function(){
			game_pause();
		};

	  // *** MOVE CAMERA ***
	  // This is where we finish up the camera setting we started in the create() 
	  // function. We set the movement speed of the camera and wire up the keys to
	  // map to the actual movement.
	  const camera_speed = 400;
	  // Stop any previous movement from the last frame
	  player.body.setVelocity(0);
	  if (cursors.left.isDown) {
	    player.body.setVelocityX(-camera_speed);
	  } 
	  if (cursors.right.isDown) {
	    player.body.setVelocityX(camera_speed);
	  } 
	  if (cursors.up.isDown) {
	    player.body.setVelocityY(-camera_speed);
	  } 
	  if (cursors.down.isDown) {
	    player.body.setVelocityY(camera_speed);
	  }

	  // console.log("phase: " + phase + ", step: " + step);
	  // *** MOVE PERSONAS ***
	  // Moving personas take place in three distinct phases: "process," "update,"
	  // and "execute." These phases are determined by the value of <phase>. 
	  // Only one of the three phases is incurred in each update cycle. 
	  if (phase == "process") {
	    // "process" takes all current locations of the personas and send them to
	    // the frontend server in a json form. Here, we first create the json 
	    // file that records all persona locations: 
	    let data = {"step": step, 
	    						"sim_code": sim_code,
	                "environment": {}}
	    for (let i=0; i<Object.keys(personas).length; i++) {
	      let persona_name = Object.keys(personas)[i];
	      data["environment"][persona_name] = {"maze": curr_maze,
	                                           "x": Math.ceil((personas[persona_name].body.position.x) / tile_width),
	                                           "y": Math.ceil((personas[persona_name].body.position.y) / tile_width)}
	    }
	    var json = JSON.stringify(data);
	    // We then send this to the frontend server: 
	    var retrieve_xobj = new XMLHttpRequest();
	    retrieve_xobj.overrideMimeType("application/json");
	    retrieve_xobj.open('POST', "{% url 'process_environment' %}", true);
	    retrieve_xobj.send(json);   
	    // Finally, we update the phase variable to start the "udpate" process. 
	    // Now that we sent all persona locations to the backend server, we need
	    // to wait until the backend determines what the personas will do next. 
	    phase = "update";
	  } 

	  else if (phase == "update") { 
	    // Update is where we * wait * for the backend server to finish 
	    // computing about what the personas will do next given their current 
	    // situation. 
	    // We do this by continuously asking the backend server if it is ready. 
	    // The backend server is ready when it returns a json that has a key-val
	    // pair with "<move>": true.
	    // Note that we do not want to overburden the backend too much by 
	    // over-querying; so, we have a timer set so we only query it once every
	    // timer_max cycles. 
	    if (timer <= 0) {
	      var update_xobj = new XMLHttpRequest();
	      update_xobj.overrideMimeType("application/json");
	      update_xobj.open('POST', "{% url 'update_environment' %}", true);
	      update_xobj.addEventListener("load", function() {
	        if (this.readyState === 4) {
	          if (update_xobj.status === 200) {
	            if (JSON.parse(update_xobj.responseText)["<step>"] == step) {
	              execute_movement = JSON.parse(update_xobj.responseText)
	              phase = "execute";
	            }
	            timer = timer_max;
	          }
	        }
	      });
	      update_xobj.send(JSON.stringify({"step": step, "sim_code": sim_code }));   
	    }
	    timer = timer - 1; 
	  } 

	  else { 
	    // This is where we actually move the personas in the visual world. Each
	    // backend computation in execute_movement moves each persona by one tile
	    // (or some personas might not move if they choose not to). 
	    // The execute_count_max is computed by tile_width/movement_speed, which
	    // defines a one step sequence in this world. 
	    document.getElementById("game-time-content").innerHTML = execute_movement["meta"]["curr_time"];
	    for (let i=0; i<Object.keys(personas).length; i++) {
	      let curr_persona_name = Object.keys(personas)[i];
	      let curr_persona = personas[curr_persona_name];
	      let curr_pronunciatio = pronunciatios[Object.keys(personas)[i]];

	      if (execute_count == execute_count_max) { 
	        let curr_x = execute_movement["persona"][curr_persona_name]["movement"][0];
	        let curr_y = execute_movement["persona"][curr_persona_name]["movement"][1];
	        movement_target[curr_persona_name] = [curr_x * tile_width, 
	                                              curr_y * tile_width]; 
	        let pronunciatio_content = execute_movement["persona"][curr_persona_name]["pronunciatio"];
	        // This is what gives the pronunciatio balloon the name initials. We 
	        // use regex to extract the initials of the personas. 
	        // E.g., "Dolores Murphy" -> "DM"
	        let rgx = new RegExp(/(\p{L}{1})\p{L}+/, 'gu');
	        let initials = [...curr_persona_name.matchAll(rgx)] || [];
	        initials = (
	          (initials.shift()?.[1] || '') + (initials.pop()?.[1] || '')
	        ).toUpperCase();
	        pronunciatios[curr_persona_name].setText(initials + ": " + pronunciatio_content);
	      }

	      console.log(curr_persona_name);
	      if (execute_count > 0) {
	        if (curr_persona.body.x < movement_target[curr_persona_name][0]) {
	          curr_persona.body.x += movement_speed; 
	          anims_direction = "r";
	          pre_anims_direction = "r"
	          pre_anims_direction_dict[curr_persona_name] = "r"
	        } else if (curr_persona.body.x > movement_target[curr_persona_name][0]) {
	          curr_persona.body.x -= movement_speed; 
	          anims_direction = "l";
	          pre_anims_direction = "l"
	          pre_anims_direction_dict[curr_persona_name] = "l"
	        } else if (curr_persona.body.y < movement_target[curr_persona_name][1]) {
	          curr_persona.body.y += movement_speed;
	          anims_direction = "d";
	          pre_anims_direction = "d"
	          pre_anims_direction_dict[curr_persona_name] = "d"
	        } else if (curr_persona.body.y > movement_target[curr_persona_name][1]) {
	          curr_persona.body.y -= movement_speed;
	          anims_direction = "u";
	          pre_anims_direction = "u"
	          pre_anims_direction_dict[curr_persona_name] = "u"
	        } else {
	        	anims_direction = "";
	        }

	        curr_pronunciatio.x = curr_persona.body.x - 6; 
          curr_pronunciatio.y = curr_persona.body.y - 42 - 32; // DEBUG 1 --- I added 32 offset on Dec 29. 

          let tex_key = curr_persona_name.replace(/ /g, "_");
          if (anims_direction == "l") {
			      curr_persona.anims.play(tex_key + "-left-walk", true);
			    } else if (anims_direction == "r") {
			      curr_persona.anims.play(tex_key + "-right-walk", true);
			    } else if (anims_direction == "u") {
			      curr_persona.anims.play(tex_key + "-up-walk", true);
			    } else if (anims_direction == "d") {
			      curr_persona.anims.play(tex_key + "-down-walk", true);
			    } else {
			      curr_persona.anims.stop();

			      // If we were moving, pick an idle frame to use
			      if (pre_anims_direction_dict[curr_persona_name] == "l") curr_persona.setTexture(tex_key, "left");else
			      if (pre_anims_direction_dict[curr_persona_name] == "r") curr_persona.setTexture(tex_key, "right");else
			      if (pre_anims_direction_dict[curr_persona_name] == "u") curr_persona.setTexture(tex_key, "up");else
			      if (pre_anims_direction_dict[curr_persona_name] == "d") curr_persona.setTexture(tex_key, "down");
			    };

	      } 
	      else {
	        // Once we are done moving the personas, we move on to the "process"
	        // stage where we will send the current locations of all personas at the
	        // end of the movemments to the frontend server, and then the backend.
	        for (let i=0; i<Object.keys(personas).length; i++) {
	          let curr_persona_name = Object.keys(personas)[i]
	          let curr_persona = personas[curr_persona_name];
	          curr_persona.body.x = movement_target[curr_persona_name][0];
	          curr_persona.body.y = movement_target[curr_persona_name][1];
	        }
	        phase = "process";
	        execute_count = execute_count_max + 1;
	        step = step + 1;
	      }
	    }

	    // Filling in the action description. 
	    if (execute_count == execute_count_max) { 
	      for (let i=0; i<Object.keys(personas).length; i++) {
	      	let action_description = ""
	        let curr_persona_name = Object.keys(personas)[i];
	        let curr_persona_name_os = curr_persona_name.replace(/ /g,"_");
	        let description_content = execute_movement["persona"][curr_persona_name]["description"];
	        let chat_content = ""

	        if (execute_movement["persona"][curr_persona_name]["chat"] != null ){
		        for (let j=0; j<execute_movement["persona"][curr_persona_name]["chat"].length; j++) { 
		        	chat_content += execute_movement["persona"][curr_persona_name]["chat"][j][0] + ": " + execute_movement["persona"][curr_persona_name]["chat"][j][1] + "<br>"
		        }
		      } else {
		      	chat_content = "<em>None at the moment</em>"
		      }
	        // action_description += description_content + "<br>";

	        document.getElementById("current_action__"+curr_persona_name_os).innerHTML = description_content.split("@")[0];
	        document.getElementById("target_address__"+curr_persona_name_os).innerHTML = description_content.split("@")[1];
	        document.getElementById("chat__"+curr_persona_name_os).innerHTML = chat_content;

	        // Cache this step's live info so the click-to-inspect popout can show it.
	        // The popout itself refreshes on a 10s timer (see setInterval above),
	        // not on every step, to avoid flicker.
	        live_state[curr_persona_name] = {
	          doing_now: description_content.split("@")[0],
	          location: description_content.split("@")[1],
	          chat_html: chat_content
	        };
	      }
	      
	    }

	    execute_count = execute_count - 1;
	  }
	}

	// Open the full "State Details" page for a persona. We first persist the
	// *live* step (the JS <step> that advances as the sim plays, not the stale
	// page-load step) into curr_step.json, then navigate using that same step.
	// This way the state page reflects the time the user clicked, and returning
	// to the simulation resumes the clock there instead of restarting at 00:00.
	// Declared as a top-level function so the inline onclick in home.html can
	// reach it (script-scoped `let` vars like <step> are not on window).
	function openStateDetails(persona_name_os) {
		var target_step = step;
		var go = function() {
			window.location.href = "/replay_persona_state/" + encodeURIComponent(sim_code)
			                     + "/" + target_step + "/" + persona_name_os + "/";
		};
		var xhr = new XMLHttpRequest();
		xhr.open('POST', "{% url 'save_home_step' %}", true);
		xhr.setRequestHeader('Content-Type', 'application/json');
		xhr.onreadystatechange = function() { if (xhr.readyState === 4) go(); };
		xhr.onerror = go;
		xhr.send(JSON.stringify({"step": target_step}));
	}

	// Control button binders
	var play_button=document.getElementById("play_button");
	var pause_button=document.getElementById("pause_button");

	if (mode === "replay") {
		play_button.onclick = replayPlay;
		pause_button.onclick = replayPause;
		let stop_button = document.getElementById("stop_button");
		let restart_button = document.getElementById("restart_button");
		let speed_select = document.getElementById("replay_speed");
		let scrubber = document.getElementById("replay_scrubber");
		let time_jump_input = document.getElementById("replay_time_jump_input");
		let time_jump_button = document.getElementById("replay_time_jump_button");
		if (stop_button) stop_button.onclick = replayStop;
		if (restart_button) restart_button.onclick = replayRestart;
		if (speed_select) speed_select.onchange = function() { onReplaySpeedChange(this.value); };
		if (scrubber) scrubber.oninput = function() { onReplayScrub(this.value); };
		if (time_jump_button) time_jump_button.onclick = function() { onReplayTimeJump(time_jump_input.value); };
	}
</script>
